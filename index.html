<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfeef8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="도토리 마을">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}</style>
<title>도토리 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
</head><body>
<style>
/* Layout: full-screen storybook village. Portrait: status on top, d-pad bottom-left and action bottom-right above the menu bar, sheets rise from the bottom.
   Landscape: d-pad and action in the bottom corners, menu bar between them, sheets slide in from the right. One committed pastel look. */
:root{
  --ink:#5b4b78; --ink-soft:#8a7ca6; --paper:#fffaf4; --line:#e6dcf2;
  --mint:#8fd8b8; --mint-dk:#5fb894; --butter:#ffe6a3; --peach:#ffc8b4; --pink:#ffb7c9; --lav:#cdbcf2; --sky:#cfeef8; --warn:#ef7f8f;
  --f-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --shadow:0 4px 0 var(--line), 0 8px 18px rgba(91,75,120,.12);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#d2eef8;color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5}
.ui > *{pointer-events:auto}
#labels{position:fixed;inset:0;z-index:4;pointer-events:none}
#labels *{pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;color:var(--ink);background:rgba(255,250,244,.92);padding:2px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(91,75,120,.15)}
.lbl.me{background:var(--mint);color:#fff}
.lbl .on{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fe0a8;margin-right:4px;vertical-align:1px;box-shadow:0 0 0 2px #fff}
.bub{position:absolute;transform:translate(-50%,-100%);font-size:22px;color:var(--ink);background:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}

.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none}
.top > *{pointer-events:auto}
.chip{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:6px 12px;font-size:14px;line-height:1.3;font-variant-numeric:tabular-nums}
.chip small{display:block;font-size:11px;color:var(--ink-soft);font-family:var(--f-body)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.acorn{display:flex;align-items:center;gap:6px;font-size:17px}
.acorn.debt{background:#ffe6ea;color:var(--warn)}
.acorn i{width:14px;height:16px;display:inline-block;background:linear-gradient(#b88a6a 0 36%,transparent 36%),radial-gradient(circle at 50% 70%,#f2c08a 0 55%,transparent 56%)}
.stam{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px}
.stam .sbar{display:inline-block;width:64px;height:9px;border-radius:6px;background:#f0e8f6;overflow:hidden}
.stam .sbar i{display:block;height:100%;background:var(--mint);border-radius:6px}
.stam .sbar i.low{background:var(--warn)}
.status{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.tag{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--paper);box-shadow:0 2px 6px rgba(91,75,120,.12)}
.tag.bad{background:#ffe6ea;color:var(--warn)}
.tag.job{background:var(--butter)}
.zoom{display:flex;flex-direction:column;gap:6px;position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 74px)}
.zoom button{width:38px;height:38px;font-size:20px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.zoom .ico{width:22px;height:22px}
#mapCv{width:100%;background:#a8dcf0;touch-action:none;display:block;transform-origin:0 0}
.mapvp{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:18px;background:#a8dcf0;touch-action:none}
.mapzoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.mapzoom button{width:38px;height:38px;border-radius:50%;padding:0;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(80,60,120,.18)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-soft);font-family:var(--f-body)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

button{font-family:var(--f-ui);font-size:16px;color:var(--ink);background:var(--paper);border:0;border-radius:16px;box-shadow:var(--shadow);padding:9px 8px;cursor:pointer;position:relative;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
button:disabled{opacity:.5}
button.go{background:var(--mint);color:#fff}
button.sun{background:var(--butter)}
button.bad{background:var(--pink);color:#fff}

.bar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bar button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;padding:6px 2px}
.ico{display:block;width:24px;height:24px;color:var(--ink)}
.badge{position:absolute;top:-6px;right:-4px;background:var(--warn);color:#fff;border-radius:999px;font-size:12px;min-width:20px;padding:1px 5px}

#dpad{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:132px;height:132px;border-radius:50%;background:rgba(255,250,244,.78);box-shadow:var(--shadow);touch-action:none}
#dpad .ar{position:absolute;width:0;height:0;border:9px solid transparent;opacity:.55}
#dpad .u{left:57px;top:8px;border-bottom:12px solid var(--ink);border-top:0}
#dpad .d{left:57px;bottom:8px;border-top:12px solid var(--ink);border-bottom:0}
#dpad .l{top:57px;left:8px;border-right:12px solid var(--ink);border-left:0}
#dpad .r{top:57px;right:8px;border-left:12px solid var(--ink);border-right:0}
#knob{position:absolute;left:40px;top:40px;width:52px;height:52px;border-radius:50%;background:var(--lav);box-shadow:inset 0 -4px 0 rgba(91,75,120,.18),0 3px 8px rgba(91,75,120,.2);pointer-events:none;transition:transform .05s}
#actBtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 98px);width:96px;height:96px;border-radius:50%;font-size:17px;background:var(--butter);padding:0;line-height:1.15}
#actBtn.hot{background:var(--pink);color:#fff}
#rideBtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 206px);padding:7px 14px;border-radius:999px;font-size:14px}

.panel{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-height:72%;display:flex;flex-direction:column;background:var(--paper);border-radius:24px;box-shadow:0 10px 30px rgba(91,75,120,.22);z-index:8}
.panel.half{max-height:52%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px;font-size:19px}
.ph button{padding:5px 14px;font-size:14px;border-radius:999px}
.pb > *{flex-shrink:0}
.pb{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;font-family:var(--f-body)}
.pb button,.pb .cell,.pb .tabs{font-family:var(--f-ui)}
h3{margin:0;font-size:14px;color:var(--ink-soft);font-weight:normal;letter-spacing:.04em;font-family:var(--f-ui)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{border-radius:16px;padding:9px 6px;text-align:center;background:#fff;font-size:14px;line-height:1.3;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.cell.no{background:#f4eff8;color:var(--ink-soft)}
.cell b{display:block;font-weight:normal;font-size:12px;color:var(--ink-soft);font-family:var(--f-body)}
.cell.sel{background:var(--butter)}
.cell.on{box-shadow:0 0 0 3px var(--mint) inset}
.cell .own{font-size:11px;color:var(--mint-dk)}
.sw{width:30px;height:18px;margin:0 auto 5px;border-radius:9px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.tabs button{flex:0 0 auto;padding:6px 12px;font-size:14px;border-radius:999px;box-shadow:0 2px 0 var(--line)}
.tabs button.on{background:var(--lav);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}
.prog{flex:1;height:10px;border-radius:6px;background:#f0e8f6;overflow:hidden;max-width:140px}
.prog i{display:block;height:100%;background:var(--mint)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:6px 12px;font-size:14px;border-radius:999px;box-shadow:0 2px 0 var(--line)}
.seg button.on{background:var(--lav);color:#fff}
.dots{display:flex;gap:10px;flex-wrap:wrap}
.dots button{width:34px;height:34px;padding:0;border-radius:50%;box-shadow:0 2px 0 var(--line)}
.dots button.on{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--lav)}
.letter{border-radius:16px;background:#fff;padding:10px 12px;font-size:15px;line-height:1.5;word-break:break-word;box-shadow:0 2px 0 var(--line)}
.letter .meta{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.card{border-radius:18px;background:#fff;padding:12px 14px;display:flex;flex-direction:column;gap:7px;font-size:15px;line-height:1.5;box-shadow:0 2px 0 var(--line)}
.card.warn{background:#fff0f0}
.card .k{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-ui)}
.buybar{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:14px;line-height:1.4}
.buybar button{flex:0 0 auto}
textarea,select,input{font-family:var(--f-body);font-size:16px;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:9px;background:#fff;width:100%;box-sizing:border-box}
textarea{resize:none;height:76px}
.note{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);background:rgba(91,75,120,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:15px;z-index:30;max-width:84%;text-align:center;line-height:1.4}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;background:var(--paper);border-radius:24px;box-shadow:0 12px 34px rgba(91,75,120,.25);padding:16px 24px;text-align:center;min-width:220px;max-width:84%;line-height:1.5;font-family:var(--f-body)}
.pop .big{font-size:23px;font-family:var(--f-ui)}
.pop .new{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:1px 9px;font-size:13px;margin-bottom:6px}
.pop.bad{background:#fff0f2}

#mini{position:fixed;inset:0;z-index:25;background:rgba(91,75,120,.35);display:flex;align-items:flex-end;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(10px,env(safe-area-inset-left,0px))}
.mbox{width:100%;max-width:460px;max-height:100%;overflow-y:auto;box-sizing:border-box;background:var(--paper);border-radius:26px;box-shadow:0 12px 34px rgba(91,75,120,.25);padding:16px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-variant-numeric:tabular-nums}
.strikes span{display:inline-block;width:14px;height:14px;border-radius:50%;margin-left:4px;background:#f0e8f6;vertical-align:-2px}
.strikes span.x{background:var(--warn)}
.tbar{height:12px;border-radius:7px;background:#f0e8f6;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--butter)}
.order{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px;min-height:64px;box-shadow:0 2px 0 var(--line)}
.order .who{font-size:13px;color:var(--ink-soft);width:56px;flex:0 0 auto}
.cups{display:flex;gap:10px;flex-wrap:wrap}
.cup{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px}
.cup i{width:24px;height:28px;border-radius:5px 5px 11px 11px;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.tray{display:flex;gap:8px;min-height:40px;align-items:center;font-size:13px;color:var(--ink-soft);font-family:var(--f-body)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns button{padding:14px 6px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.box3d{align-self:center;width:110px;height:84px;border-radius:14px;background:#f2d6a8;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.box3d span{width:58px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
#arrow{position:fixed;z-index:6;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none}

#pick{position:fixed;inset:0;z-index:40;background:linear-gradient(#cfeef8,#fdf0f4 55%,#e2f4d8);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:14px}
#pick h1{margin:0;font-size:34px;font-weight:normal;text-wrap:balance;text-align:center;color:var(--ink)}
#pick p{margin:0;font-size:15px;text-align:center;line-height:1.6;max-width:30ch;font-family:var(--f-body)}
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.pcard{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);padding:12px}
.pcard .who{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard .who div{display:flex;gap:6px}
.pcard .who input{flex:1;min-width:0;padding:7px 10px}
.pcard .who button{flex:0 0 auto;padding:7px 14px;font-size:15px}
.pcard .seen{font-size:12px;color:var(--ink-soft);font-family:var(--f-body)}
.ava{width:64px;height:64px}
.storeStatus{font-size:13px;opacity:.75;font-family:var(--f-body)}
.authbox{width:min(340px,100%);background:rgba(255,255,255,.82);border-radius:24px;padding:20px 18px;box-shadow:0 10px 30px rgba(120,90,160,.15);display:flex;flex-direction:column;gap:10px}
.authbox h2{margin:0;font-weight:normal;font-size:22px;text-align:center;color:var(--ink)}
.authbox label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-family:var(--f-body);color:#7a6f96}
.authbox input{font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:1.5px solid #e2d8f2;background:#fff;color:var(--ink);outline:none}
.authbox input:focus{border-color:#b9a6f0}
.authbox button{font-size:17px;padding:13px;border-radius:16px}
.authbox button.ghost{background:transparent;box-shadow:none;font-size:14px;color:#7a6f96;padding:6px}
.authbox .amsg{min-height:20px;margin:0;font-size:14px;color:#5fb894;font-family:var(--f-body);max-width:none}
.authbox .amsg.bad{color:#e0647a}
.authbox .anote{margin:0;font-size:13px;color:#7a6f96;max-width:none}
.authbox button.gbtn{background:#fff;color:#3c3c4a;border:1.5px solid #e2d8f2}
.adminLink{font-size:12px;color:#9a8fb6;font-family:var(--f-body);text-decoration:none;margin-top:6px}

@media (orientation: landscape) and (max-height: 560px){
  .bar{left:50%;right:auto;transform:translateX(-50%);width:min(420px,52vw);grid-template-columns:repeat(5,1fr)}
  #dpad{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:120px;height:120px}
  #dpad .u{left:51px} #dpad .d{left:51px} #dpad .l{top:51px} #dpad .r{top:51px}
  #knob{left:36px;top:36px;width:48px;height:48px}
  #actBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:88px;height:88px}
  #rideBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 116px)}
  .zoom{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);flex-direction:row}
  .panel,.panel.half{left:auto;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(430px,50vw);max-height:none}
  #mini{align-items:center}
  .mbox{max-width:600px}
  .mbtns{grid-template-columns:repeat(4,1fr)}
  .mbtns button{padding:10px 4px;font-size:15px;flex-direction:column;gap:4px}
  .toast{top:calc(env(safe-area-inset-top,0px) + 14px)}
  .status{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
}
#roomBtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 120px);padding:8px 14px;border-radius:999px;background:var(--lav);color:#fff;font-size:15px}
#talk{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:26;display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:start;background:var(--paper);border-radius:26px;box-shadow:0 12px 34px rgba(91,75,120,.25);padding:14px 16px 16px;max-width:620px;margin:0 auto}
#talk .portrait{width:78px;height:78px;border-radius:50%;background:linear-gradient(#fdf0f4,#e8f6fb);overflow:hidden;display:flex;align-items:center;justify-content:center}
#talk .portrait canvas{width:78px;height:78px}
#talk .who{font-size:14px;color:var(--ink-soft);margin-bottom:4px}
#talk .text{font-family:var(--f-body);font-size:17px;line-height:1.6;min-height:54px;color:var(--ink)}
#talk .next{position:absolute;right:20px;bottom:12px;width:0;height:0;border:8px solid transparent;border-top:10px solid var(--lav);animation:bob 0.9s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#talk .choices{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px}
#talk .choices button{padding:8px 14px;border-radius:999px;font-size:15px}
#talk .choices:empty{display:none}
@media (orientation: landscape) and (max-height: 560px){ #roomBtn{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 116px)} #talk{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)} }
.pvcard{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 0 var(--line)}
.pvbox{width:132px;height:112px;border-radius:14px;background:radial-gradient(circle at 50% 65%,#5e5482,#2e2944 75%);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.pvcv{width:100%;height:100%;display:block}
.pvinfo{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:14px;line-height:1.5}
.pvinfo b{font-family:var(--f-ui);font-weight:normal;font-size:17px}
.pvinfo .pr{font-family:var(--f-ui);color:var(--ink-soft);font-size:13px}
.desc{background:#fff;border-radius:16px;padding:9px 12px;font-size:14px;line-height:1.55;box-shadow:0 2px 0 var(--line)}

<script>/* 도토리 마을 — web version: Google login (only accounts the admin registered) and the village server (Firebase). */
window.DVNet = (() => {
  firebase.initializeApp(window.DV_FIREBASE || {});
  const auth = firebase.auth(), db = firebase.database();
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const keyOf = email => String(email || '').trim().toLowerCase().replace(/\./g, ',');
  let resolveReady; const ready = new Promise(r => resolveReady = r);
  const api = { ready, session:null, base:null };

  /* in-app browsers (KakaoTalk, Instagram, NAVER…) can't do Google login → send to the real browser */
  const UA = navigator.userAgent || '';
  const inApp = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\/|DaumApps|everytimeApp|SamsungBrowser\/[0-9.]+ .*CrossApp/i.test(UA);
  if (/KAKAOTALK/i.test(UA)){ location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); }

  /* ---------- login screen ---------- */
  function ui(html){ const box = $('#authBox'); if (box) box.innerHTML = html; }
  function msg(t, bad){ const m = $('#authMsg'); if (m){ m.textContent = t || ''; m.classList.toggle('bad', !!bad); } }
  const G_ICON = '<svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" style="vertical-align:-4px;margin-right:8px"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  function showLogin(note){
    if (inApp){ ui('<h2>브라우저에서 열어 주세요</h2><p class="anote">카카오톡·인스타그램 같은 앱 안에서는 구글 로그인이 안 돼요. 오른쪽 위(또는 아래) 메뉴에서 <b>다른 브라우저로 열기</b>(Chrome, Safari)를 눌러 주세요.</p><button class="go" id="aCopy">주소 복사하기</button><p id="authMsg" class="amsg"></p>');
      $('#aCopy').onclick = () => { try{ navigator.clipboard.writeText(location.href); msg('주소를 복사했어요. Chrome이나 Safari에 붙여넣어 주세요'); }catch(e){ msg(location.href); } }; return; }
    ui('<h2>시작하기</h2><p class="anote">관리자가 등록해 둔 구글 계정으로만 들어올 수 있어요.</p>'+
      '<button class="go gbtn" id="aGoogle">'+G_ICON+'Google 계정으로 시작하기</button><p id="authMsg" class="amsg"></p>');
    if (note) msg(note, true);
    $('#aGoogle').onclick = signIn;
  }
  function showDenied(email){
    ui('<h2>등록되지 않은 계정이에요</h2><p class="anote"><b>'+esc(email)+'</b><br>관리자에게 이 이메일을 알려 주고 등록을 부탁해 주세요.</p>'+
      '<button class="go" id="aOther">다른 구글 계정으로 시작하기</button><p id="authMsg" class="amsg"></p>');
    $('#aOther').onclick = async () => { await auth.signOut(); signIn(); };
  }
  function errText(e){
    const c = e && e.code || '';
    if (c.includes('popup-closed') || c.includes('cancelled-popup')) return '';
    if (c.includes('unauthorized-domain')) return '이 주소는 아직 로그인 허용 목록에 없어요 (Firebase 승인된 도메인)';
    if (c.includes('network')) return '인터넷 연결을 확인해 주세요';
    if (c.includes('PERMISSION') || c.includes('permission')) return '권한이 없어요. 관리자에게 문의해 주세요';
    return (e && (e.msg || e.message)) || '문제가 생겼어요. 다시 시도해 주세요';
  }
  async function signIn(){
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt:'select_account' });
    msg('구글 로그인 창을 여는 중…');
    try{ await auth.signInWithPopup(p); }
    catch(e){
      if ((e.code || '').includes('popup-blocked') || (e.code || '').includes('operation-not-supported')){ try{ await auth.signInWithRedirect(p); return; }catch(e2){ e = e2; } }
      msg(errText(e), true);
    }
  }
  let entering = false;
  async function enter(user){
    if (api.session || entering) return; entering = true;
    try{
      ui('<p class="anote">확인 중…</p>');
      const a = (await db.ref('allowed/' + keyOf(user.email)).get()).val();
      if (!a){ entering = false; showDenied(user.email); return; }
      api.session = { uid:user.uid, email:user.email, village:a.village, slot:a.slot, pid:a.pid, name:a.name };
      api.base = 'villages/' + a.village + '/';
      ui('<p class="anote">'+esc(a.name || '')+'님, '+esc(a.village)+' 마을로 들어가는 중…</p>');
      startLive();
      resolveReady(api.session);
    }catch(e){ entering = false; console.warn(e); if ((e.code || e.message || '').toString().toLowerCase().includes('permission')) showDenied(user.email); else showLogin(errText(e)); }
  }
  auth.getRedirectResult().catch(e => { const t = errText(e); if (t) setTimeout(() => msg(t, true), 300); });
  auth.onAuthStateChanged(user => { if (user) enter(user); else if (!api.session) showLogin(); });

  /* ---------- village data ---------- */
  api.on = (path, fn) => { db.ref(api.base + path).on('value', s => fn(s.val()), e => console.warn('read', path, e)); };
  api.set = (path, val) => db.ref(api.base + path).set(val).catch(e => console.warn('write', path, e));
  api.onLast = (path, n, fn) => { db.ref(api.base + path).orderByKey().limitToLast(n).on('value', s => fn(s.val()), e => console.warn('read', path, e)); };
  api.remove = path => db.ref(api.base + path).remove().catch(e => console.warn('remove', path, e));
  api.push = (path, val) => db.ref(api.base + path).push(val).catch(e => console.warn('push', path, e));
  api.signOut = async () => { try{ await db.ref(api.base + 'live/' + api.session.pid).remove(); }catch(e){} await auth.signOut(); location.reload(); };
  api.who = () => api.session ? api.session.email : '';

  /* ---------- live positions (who is online right now) ---------- */
  const liveCbs = [];
  let liveRef = null, lastSent = '', lastAt = 0;
  function startLive(){
    liveRef = db.ref(api.base + 'live/' + api.session.pid);
    db.ref('.info/connected').on('value', s => { if (s.val() === true){ liveRef.onDisconnect().remove(); lastSent = ''; } });
    db.ref(api.base + 'live').on('value', s => { const v = s.val() || {}; liveCbs.forEach(f => f(v)); });
  }
  api.onLive = fn => liveCbs.push(fn);
  api.sendLive = (state, force) => {
    if (!liveRef) return; const now = Date.now(); const j = JSON.stringify(state);
    if (!force && j === lastSent && now - lastAt < 4000) return;
    lastSent = j; lastAt = now; liveRef.set(Object.assign({ at:firebase.database.ServerValue.TIMESTAMP }, state)).catch(() => {});
  };
  api.clearLive = () => { if (liveRef) liveRef.remove().catch(() => {}); lastSent = ''; };
  return api;
})();
</script>
<script>// Char3D v2 — smooth toon chibi with pixel-art face/clothes textures and wearable slots.
// build(THREE, L) where L = { skin, hair, hairColor, eyes, mouth,
//   top:{style,c1,c2,sleeve}, lower:{style,c}, hat:{style,c,c2}, face:{style,c}, shoes:{style,c},
//   back:{style,c,c2}, hand:{style,c,c2} }   (any slot may be null)
const Char3D = (() => {
  let gradMap = null;
  const matCache = new Map();
  function toon(THREE, color, map, extra) {
    if (!gradMap) {
      const d = new Uint8Array([150, 150, 150, 255, 210, 210, 210, 255, 255, 255, 255, 255]);
      gradMap = new THREE.DataTexture(d, 3, 1, THREE.RGBAFormat); gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter; gradMap.needsUpdate = true;
    }

    let db = null;
    try{ if (window.claude && typeof window.claude.use === 'function') db = await Promise.race([ window.claude.use('db'), new Promise(r => setTimeout(() => r(null), 9000)) ]); }catch(e){ db = null; }
    if (db){ this.db = db; this.mode = 'db'; this.subDb(); } else { this.mode = 'local'; this.loadLocal(); }
    this.emit('mode');
  },
  loadLocal(){ const d = LS.get('dv2.local', null); if (d) this.data = { placed:d.placed||{}, players:d.players||{}, mail:d.mail||[] }; ['placed','players','mail'].forEach(k => this.emit(k)); },
  saveLocal(){ LS.set('dv2.local', this.data); },
  err(e){
    console.warn(e);
    if (e && e.code === 'invalid_argument' && !this.readOnly){ this.readOnly = true; toast('가족 마을에 저장할 권한이 없어요. 공유 메뉴에서 편집자로 초대받으면 같이 할 수 있어요.', 5000); }
    else if (e && e.code === 'quota_exceeded') toast('마을 저장 공간이 가득 찼어요.');
  },
  subDb(){
    const db = this.db;
    db.collection('placed').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); this.data.placed = m; this.emit('placed'); }, e => this.err(e));
    db.collection('players').onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data(); }); this.data.players = m; this.emit('players'); }, e => this.err(e));
    db.collection('mail').orderBy('at','desc').limit(40).onSnapshot(s => { this.data.mail = s.docs.map(d => Object.assign({ id:d.id }, d.data())); this.emit('mail'); }, e => this.err(e));
  },
  subFb(){
    const N8 = this.net, P = j => { try{ return typeof j === 'string' ? JSON.parse(j) : j; }catch(e){ return null; } };
    let got = { placed:false, players:false, mail:false };
    const done = k => { if (!got[k]){ got[k] = true; if (got.placed && got.players && got.mail) this.emit('loaded'); } };
    N8.on('placed', v => { const m = {}; Object.entries(v || {}).forEach(([k,j]) => { const o = P(j); if (o) m[k] = o; }); this.data.placed = m; this.emit('placed'); done('placed'); });
    N8.on('players', v => { const m = {}; Object.entries(v || {}).forEach(([k,j]) => { const o = P(j); if (o) m[k] = o; }); this.data.players = m; this.emit('players'); done('players'); });
    N8.on('mail', v => { this.data.mail = Object.entries(v || {}).map(([k,j]) => Object.assign({ id:k }, P(j))).filter(m => m.at).sort((a,b) => b.at - a.at).slice(0, 40); this.emit('mail'); done('mail'); });
  },
  write(path, fn){ this.q[path] = (this.q[path] || Promise.resolve()).then(fn).catch(e => this.err(e)); return this.q[path]; },
  setPlaced(key, obj){ if (this.mode === 'fb'){ this.data.placed[key] = obj; this.net.set('placed/'+key, JSON.stringify(obj)); this.emit('placed'); return; } if (this.mode === 'db') this.write('placed/'+key, () => this.db.doc('placed/'+key).set(obj)); else { this.data.placed[key] = obj; this.saveLocal(); this.emit('placed'); } },
  delPlaced(key){ if (this.mode === 'fb'){ delete this.data.placed[key]; this.net.set('placed/'+key, null); this.emit('placed'); return; } if (this.mode === 'db') this.write('placed/'+key, () => this.db.doc('placed/'+key).delete()); else { delete this.data.placed[key]; this.saveLocal(); this.emit('placed'); } },
  savePlayer(id, obj, now){
    const go = () => {
      const body = JSON.parse(JSON.stringify(obj));
      if (this.mode === 'fb'){ this.data.players[id] = body; this.net.set('players/'+id, JSON.stringify(body)); return; }
      if (this.mode === 'db') this.write('players/'+id, () => this.db.doc('players/'+id).set(body));
      else { this.data.players[id] = body; this.saveLocal(); }
    };
    clearTimeout(this.timers[id]); if (now) go(); else this.timers[id] = setTimeout(go, 900);
  },
  addMail(m){ if (this.mode === 'fb'){ this.net.push('mail', JSON.stringify(m)); return; } if (this.mode === 'db') this.db.collection('mail').add(m).catch(e => this.err(e)); else { this.data.mail.unshift(Object.assign({ id:'m'+Date.now() }, m)); this.data.mail = this.data.mail.slice(0, 40); this.saveLocal(); this.emit('mail'); } }

const trackPts = [];
(function(){
  const h = TR.h, r = TR.r, seg = [];
  const corners = [[h-r,-h+r, -Math.PI/2],[h-r,h-r,0],[-h+r,h-r,Math.PI/2],[-h+r,-h+r,Math.PI]];
  const straights = [[-h+r,-h,h-r,-h],[h,-h+r,h,h-r],[h-r,h,-h+r,h],[-h,h-r,-h,-h+r]];
  for (let k=0;k<4;k++){
    const [x1,z1,x2,z2] = straights[k]; const L = Math.hypot(x2-x1,z2-z1); const n = Math.ceil(L/0.2);
    for (let s=0;s<n;s++) seg.push([x1+(x2-x1)*s/n, z1+(z2-z1)*s/n]);
    const [cx,cz,a0] = corners[k]; const m = Math.ceil(r*Math.PI/2/0.2);
    for (let s=0;s<m;s++){ const a = a0 + (Math.PI/2)*s/m; seg.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]); }
  }

})();

  s = ((s % TR.L) + TR.L) % TR.L;

  const segL = (lo+1 < trackPts.length ? b.s : TR.L) - a.s; const t = segL ? (s-a.s)/segL : 0;
  return { x:a.x+(b.x-a.x)*t, z:a.z+(b.z-a.z)*t, ang:Math.atan2(b.x-a.x, b.z-a.z) };
}

function blocked(i,j){

    for (const [a,b] of D){ const ni=ci+a, nj=cj+b; if (!inb(ni,nj)) continue; const n = idx(ni,nj); if (seen[n] || blocked(ni,nj)) continue; seen[n]=1; prev[n]=cur; q.push(n); }

}

function goalFor(ti,tj){
  const s = statics.get(key(ti,tj));
  if (s && s.door){ const [di,dj] = T(s.door[0], s.door[1]); return (i,j) => i===di && j===dj; }
  return adjTo(ti,tj);
}
function walkTo(ti,tj, after){
  const me = chars[G.slot]; if (G.ride) return; stopFishing();
  if (!after && blocked(ti,tj)){ toast('거기는 갈 수 없어요'); return; }
  const goal = after ? goalFor(ti,tj) : ((i,j) => i===ti && j===tj);
  if (after && goal(me.i, me.j)){ faceTile(me,ti,tj); after(); return; }
  const path = bfs(me.i, me.j, goal);
  if (!path){ toast('거기까지 가는 길이 없어요'); return; }
  me.path = path; me.onArrive = after ? () => { faceTile(me,ti,tj); after(); } : null;
}
function faceTile(c,ti,tj){ const s = statics.get(key(ti,tj)); const x = s && s.cx!==undefined ? s.cx : wx(ti), z = s && s.cz!==undefined ? s.cz : wz(tj); c.face = Math.atan2(x-c.x, z-c.z); }

function targetAt(i,j){
  if (!inb(i,j)) return null;
  const k = key(i,j), s = statics.get(k);
  if (s){ if (BY[s.id] === s) return { type:s.kind, b:s, i, j }; return { type:s.kind, s, i, j }; }
  const sp = spotAt(i,j); if (sp) return { type:'spot', sp, i, j };
  if (Store.data.placed[dkey(i,j)]) return { type:'placed', k:dkey(i,j), i, j };
  const tt = tile[idx(i,j)];
  if (tt === WATER) return { type:'water', i, j };
  if (tt === FLOWERF && G.me && !((G.me.daily && G.me.daily.fl) || []).includes(k)) return { type:'flower', i, j };
  if (tt === FARM) return { type:'farm', i, j };
  const st = STATIONS.find(st => st.tiles.some(([x,z]) => { const [a,b] = T(x,z); return a===i && b===j; }));
  if (st) return { type:'station', st, i, j };
  return null;
}
function actLabel(t){
  if (!t) return '행동';
  if (t.type === 'spot') return { bug:'잡기', shell:'줍기', forage:'캐기', dig:'파기' }[t.sp.cat];
  if (t.type === 'farm') return farmLabel(t.i, t.j);
  if (t.type === 'clerk') return '말 걸기';
  if (typeof labelExtra === 'function'){ const lx = labelExtra(t); if (lx) return lx; }
  if (t.type === 'tool') return { net:'휘두르기', shovel:'파기', can:'물 주기', rod:'낚싯대' }[G.me.tool] || '도구';
  if (t.type === 'show') return t.label || '구경';
  if (t.type === 'furn'){ const it = G.inside && G.inside.home.items[t.n]; if (!it) return '보기'; if (it.show) return showLabel(it); const F = FURN[it.id]; if (F.use === 'play' || F.use === 'piano') return '연주'; return G.inside.own ? ({ rest:'자기', ward:'옷장', mirror:'거울', tv:'TV 보기' }[F.use] || '보기') : '보기'; }
  return { house: t.b && t.b.slot===G.slot ? '집에 들어가기' : '놀러 가기', mall:'들어가기', cafe:'들어가기', depot:'들어가기', mailbox:'편지', tree:'흔들기', rock:'두드리기', water:'낚시', flower:'꽃 따기', nhouse:'놀러 가기', play:'연주', station:'기차', placed:'구경', shop:'들어가기', bank:'들어가기', npc:'말 걸기', door:'나가기' }[t.type] || '행동';
}
function act(t){
  if (!t) return;
  if (['mailbox','station','placed','furn','door'].includes(t.type)) doAnim('tap');
  switch (t.type){
    case 'house': return enterHouse(t.b.slot);
    case 'shop': return enterShop('shop');
    case 'bank': return enterShop('bank');
    case 'npc': return talkTo(t.np);
    case 'spot': return gather(t.sp);
    case 'flower': return pickFlower(t.i, t.j);
    case 'farm': return farmAct(t.i, t.j);
    case 'nhouse': return enterNpcHome(t.b.npc);
    case 'clerk': return talkTo(t.np);
    case 'show': return showAct(t);
    case 'play': return playInstrument(t.inst);
    case 'tool': return toolAction();
    case 'furn': return useFurniture(t.n);
    case 'door': return exitHouse();
    case 'mall': if (!deliveryArrive('mall')) enterShop('mall'); return;
    case 'cafe': if (!deliveryArrive('cafe')) enterShop('cafe'); return;
    case 'depot': return enterShop('depot');
    case 'mailbox': return openMail();
    case 'tree': return shakeTree(t.s);
    case 'rock': return hitRock(t.s);
    case 'water': return startFishing(t.i, t.j);
    case 'station': return openStation(t.st);
    default: if (typeof actExtra === 'function') return actExtra(t); return;
    case 'placed': { const p = Store.data.placed[t.k]; if (!p) return; let msg = DEC[p.t].name+' · '+(p.byName||'가족')+'이(가) 놓았어요';
      if (p.t==='sapling'){ const d = Math.floor((Date.now()-p.at)/DAY); msg = (p.byName||'가족')+'이(가) 심은 나무 · '+(d+1)+'일째'+(saplingStage(p.at)<3?' (30일이면 큰 나무)':''); }
      return toast(msg); }
  }
}
function onObjectTap(k){
  if (k === 'train'){ toast('기차는 역에서 탈 수 있어요'); return; }
  if (k.startsWith('st_')){ const st = STATIONS.find(s => 'st_'+s.id === k); const [i,j] = T(st.px, st.pz); return walkTo(i,j, () => openStation(st)); }
  let i, j;
  if (BY[k]) [i,j] = T(BY[k].cx, BY[k].cz); else if (k.startsWith('w_')) [i,j] = dparse(k); else [i,j] = k.split('_').map(Number);
  const t = targetAt(i,j); if (!t) return;
  walkTo(i,j, () => act(t));
}
function frontTile(c){ return [Math.round(c.x + Math.sin(c.face)*0.8) + C, Math.round(c.z + Math.cos(c.face)*0.8) + C]; }
function frontTarget(){
  const me = chars[G.slot]; if (!me) return null;
  if (G.inside){ const c = G.inside.clerkNp; if (c && !c.sleep){ const fx = me.x + Math.sin(me.face)*0.9, fz = me.z + Math.cos(me.face)*0.9; if (Math.hypot(c.x-fx, c.z-fz) < 0.9) return { type:'clerk', np:c }; }
    const f = furnAtFront(); if (f.atDoor) return { type:'door' }; if (f.n >= 0) return { type:'furn', n:f.n }; const hi = heldInstrument(); return hi ? { type:'play', inst:hi } : null; }
  const np = npcNear(); if (np) return { type:'npc', np };
  const fxt = frontExtra(); if (fxt) return fxt;
  const [fi,fj] = frontTile(me); let t = targetAt(fi,fj);
  if (!t){ const here = targetAt(me.i, me.j); if (here && here.type==='station') t = here; }
  if (!t){ // door tile in front of a building: look one more step ahead
    const s = [...new Set(statics.values())].find(b => b.door && T(b.door[0], b.door[1])[0]===me.i && T(b.door[0], b.door[1])[1]===me.j);
    if (s) t = { type:s.kind, b:s };
  }
  if (!t){ if (G.me.tool) t = { type:'tool' }; else { const hi = heldInstrument(); if (hi) t = { type:'play', inst:hi }; } }
  return t;
}

/* ---- controls: d-pad, action button, keyboard ---- */
const ctl = { pad:{ x:0, z:0 }, keys:new Set(), wasMoving:false };
const pad = $('#dpad'), knob = $('#knob');
let padId = null;
function padSet(e){
  const r = pad.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx,dy);
  if (d < 10){ ctl.pad.x = 0; ctl.pad.z = 0; knob.style.transform = ''; return; }
  const a = Math.round(Math.atan2(dy,dx) / (Math.PI/4)) * (Math.PI/4);
  ctl.pad.x = Math.cos(a); ctl.pad.z = Math.sin(a);
  const k = Math.min(d, r.width*0.3); knob.style.transform = 'translate('+(Math.cos(a)*k)+'px,'+(Math.sin(a)*k)+'px)';
  pad.dataset.dir = Math.round(((a*180/Math.PI)+360)%360);
}
pad.addEventListener('pointerdown', e => { e.preventDefault(); padId = e.pointerId; pad.setPointerCapture(e.pointerId); padSet(e); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padSet(e); });
const padEnd = e => { if (e.pointerId !== padId) return; padId = null; ctl.pad.x = 0; ctl.pad.z = 0; knob.style.transform = ''; delete pad.dataset.dir; };
pad.addEventListener('pointerup', padEnd); pad.addEventListener('pointercancel', padEnd);

const KEYMAP = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0] };
window.addEventListener('keydown', e => {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (KEYMAP[e.key]){ ctl.keys.add(e.key); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); actionPress(); }
  else if (e.key === 'Escape' && G.panel) closePanel();
});

function canStand(x, z){
  const rr = 0.26, me = chars[G.slot], up = me ? (me.elev||0) + (me.jy||0) : 0;
  for (const [ox,oz] of [[-rr,-rr],[rr,-rr],[-rr,rr],[rr,rr]]){ const i = Math.round(x+ox)+C, j = Math.round(z+oz)+C; if (blocked(i,j)){ const h = platAt(i,j); if (!(h > 0 && up >= h - 0.06)) return false; } }
  if (me && charBlock(me, x, z)) return false;
  return true;
}
function stepControls(dt){
  if (!G.started || G.ride || G.mini || dlg || G.down || G.rescue || G.police || G.sleepAnim || G.sit || (G.panel && G.panel !== 'build' && G.panel !== 'decor')){ ctl.wasMoving = false; return; }
  if (G.boat && typeof boatControls === 'function'){ boatControls(dt); return; }
  let dx = ctl.pad.x, dz = ctl.pad.z;
  ctl.keys.forEach(k => { dx += KEYMAP[k][0]; dz += KEYMAP[k][1]; });
  const len = Math.hypot(dx,dz);
  const me = chars[G.slot]; if (!me) return;
  if (len < 0.1){ if (ctl.wasMoving){ ctl.wasMoving = false; me.moving = false; if (!G.inside){ G.me.i = me.i; G.me.j = me.j; saveMe(); } } return; }
  dx /= len; dz /= len;
  const YW = G.inside ? (G.inYaw||0) : G.yaw; if (YW){ const cy = Math.cos(YW), sy = Math.sin(YW), rx = dx*cy + dz*sy, rz = -dx*sy + dz*cy; dx = rx; dz = rz; }
  if (G.fishing) stopFishing();
  me.path = []; me.onArrive = null;
  const sp = 3.4 * (me.ride && ITEM[me.ride] ? ITEM[me.ride].v.speed : 1) * dt;
  const nx = me.x + dx*sp, nz = me.z + dz*sp;
  const ok = G.inside ? canStandIn : canStand;
  if (ok(nx, nz)){ me.x = nx; me.z = nz; }
  else if (ok(nx, me.z)) me.x = nx;
  else if (ok(me.x, nz)) me.z = nz;
  me.face = Math.atan2(dx, dz);
  if (G.inside){ me.moving = true; ctl.wasMoving = true; if (me.z > IZ + ID/2 + 0.15) exitHouse(); return; }
  me.i = Math.round(me.x)+C; me.j = Math.round(me.z)+C;
  me.moving = true; ctl.wasMoving = true;
}

const SKY = [[0,'#4a4e86',0.36,0.12],[5,'#6a6aa6',0.36,0.15],[6.5,'#ffd6c8',0.44,0.3],[8,'#d2eef8',0.5,0.46],[16.5,'#d2eef8',0.5,0.46],[18,'#ffd0bc',0.45,0.34],[19.5,'#9a8ec8',0.38,0.2],[21,'#5a5c98',0.36,0.12],[24,'#4a4e86',0.36,0.12]];

function applyTime(force){
  const h = hourNow(), k = Math.round(h*12)+settings.time+(G.inside?'i':''); if (!force && k===lastTimeKey) return; lastTimeKey = k;
  let a = SKY[0], b = SKY[1]; for (let n=0;n<SKY.length-1;n++) if (h>=SKY[n][0] && h<=SKY[n+1][0]){ a = SKY[n]; b = SKY[n+1]; break; }
  const t = (h-a[0])/Math.max(0.001,b[0]-a[0]); const col = new THREE.Color(a[1]).lerp(new THREE.Color(b[1]), t);
  scene.background = G.inside ? new THREE.Color('#d6cae4') : col; document.body.style.background = '#'+col.getHexString();

function openDialog(np, lines, sleeping){
  dlg = { np, lines:lines.map(fill), k:0, sleeping };
  const el = talkEl(); el.hidden = false;
  const pt = el.querySelector('.portrait'); pt.innerHTML = ''; pt.appendChild(npcPortrait(np.n));
  el.querySelector('.who').textContent = np.n.name + ' · ' + np.n.kind + ' ' + np.n.job;
  showLine();
}
function showLine(){
  const el = talkEl(), t = el.querySelector('.text'), ch = el.querySelector('.choices');
  ch.innerHTML = '';
  if (dlg.k < dlg.lines.length){
    const full = dlg.lines[dlg.k]; t.textContent = ''; let n = 0; clearInterval(dlg.typer);
    dlg.typing = true; dlg.typer = setInterval(() => { n += 2; t.textContent = full.slice(0, n); if (n >= full.length){ clearInterval(dlg.typer); dlg.typing = false; } }, 28);
    el.querySelector('.next').hidden = false;
    return;
  }
  el.querySelector('.next').hidden = true;
  if (dlg.sleeping){ endDialog(); return; }
  const id = dlg.np.n.id, rel = relOf(id);
  const opts = npcOptions(dlg.np);
  ch.innerHTML = opts.map(([k,l]) => '<button data-o="'+k+'">'+l+'</button>').join('');
  ch.querySelectorAll('[data-o]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); choose(b.dataset.o); }));
}
function nextLine(){
  if (!dlg) return;
  if (dlg.typing){ clearInterval(dlg.typer); dlg.typing = false; talkEl().querySelector('.text').textContent = dlg.lines[dlg.k]; return; }
  if (dlg.k < dlg.lines.length){ dlg.k++; showLine(); }
}
function sayMore(lines){ dlg.lines = lines.map(fill); dlg.k = 0; showLine(); }
function choose(o){
  if (chooseV5(o)) return;
  const np = dlg.np, id = np.n.id, L = LINES[id], rel = relOf(id);
  if (o === 'bye'){ sayMore([pickL(L.bye)]); dlg.closing = true; return; }
  if (o === 'chat'){ rel.today++; const pool = L.chat0.concat(rel.f >= 5 ? L.chat1 : [], rel.f >= 12 ? L.chat2 : []); sayMore([rel.today > 5 ? pickL(L.tooMuch) : pickL(pool)]); saveMe(); return; }
  if (o === 'gift'){
    const inv = Object.entries(G.me.inv||{}).filter(([k,n]) => n>0 && GATHER[k]);
    if (!inv.length){ sayMore(['줄 수 있는 물건이 없어요. (채집한 물건을 선물할 수 있어요)']); return; }
    if (rel.gifted === today()){ sayMore(['오늘은 벌써 선물 받았어요. 마음만 받을게요!']); return; }
    const ch = talkEl().querySelector('.choices');
    ch.innerHTML = inv.slice(0,8).map(([k,n]) => '<button data-g="'+k+'">'+GATHER[k].name+' ('+n+')</button>').join('') + '<button data-g="">그만두기</button>';
    talkEl().querySelector('.text').textContent = '무엇을 선물할까요?';
    ch.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const k = b.dataset.g; if (!k){ showLine(); return; }
      G.me.inv[k]--; rel.gifted = today(); const like = np.n.likes.includes(GATHER[k].cat); rel.f += like ? 3 : 1; saveMe(); sayMore([pickL(like ? L.giftLike : L.giftOk)]); }));
    return;
  }
  if (o === 'quest'){
    if (!rel.quest || rel.quest.day !== today()){
      const cat = pickL(np.n.likes), pool = availGather(cat).filter(([,g]) => !g.rare && g.price <= 60);
      if (!pool.length){ sayMore(['지금은 부탁할 게 없어요. 나중에 다시 물어봐 줘요!']); return; }
      const [item, g] = pickL(pool), n = 1 + Math.floor(Math.random()*2);
      rel.quest = { day:today(), item, n, done:false, reward:Math.round(g.price*n*1.6 + 20) }; saveMe();
      sayMore(['혹시 '+g.name+' '+n+'개만 구해 줄 수 있어요? 구해 오면 도토리 '+rel.quest.reward+'개 줄게요!']); return;
    }
    const q = rel.quest; if (q.done){ sayMore(['오늘 부탁은 벌써 들어줬어요. 정말 고마워요!']); return; }
    if ((G.me.inv[q.item]||0) >= q.n){ G.me.inv[q.item] -= q.n; q.done = true; rel.f += 3; earn(q.reward); sayMore(['와, '+GATHER[q.item].name+'! 고마워요! 약속한 도토리 '+q.reward+'개예요.']); }
    else sayMore([GATHER[q.item].name+' '+q.n+'개, 아직 모자라요. ('+(G.me.inv[q.item]||0)+'/'+q.n+') 천천히 구해 와요!']);
    return;
  }
}
function endDialog(){ if (!dlg) return; clearInterval(dlg.typer); dlg.np.talking = false; dlg = null; talkEl().hidden = true; }

let cropRoot = null, soilMesh = null; const cropMeshes = new Map();

    case 'corn': M(GC('cstalk2', () => new THREE.CylinderGeometry(0.035,0.045,0.8,6)), '#9fd49a', 0, 0.4, 0, g); [-1,1].forEach(s => { const l = M(SPH(0.16, 8, 6), leaf, 0.1*s, 0.5, 0, g); l.scale.set(1.2, 0.2, 0.4); l.rotation.z = 0.5*s; }); M(GC('cob', () => new THREE.CapsuleGeometry(0.05, 0.14, 4, 8)), C.c, 0.07, 0.55, 0.03, g).rotation.z = -0.4; break;

function syncCrops(){

    if (p && CROPS[p.c]){ const st = cropState(p); col = st.wet ? '#b8906c' : '#e2c09a'; seen.add(k); const sig = p.c+st.stage;

/* ---------- villagers on the move: homes, shops, stations, Toni's tours, Kini tagging along ---------- */
function nearestFree(x, z){
  const [ci,cj] = T(Math.round(x), Math.round(z));
  for (let r=0;r<8;r++) for (let a=-r;a<=r;a++) for (let b=-r;b<=r;b++){ if (Math.max(Math.abs(a),Math.abs(b)) !== r) continue; const i = ci+a, j = cj+b; if (inb(i,j) && !blocked(i,j)) return [i,j]; }
  return [ci,cj];
}
const npcAtWork = n => { if (!n.work) return false; const h = hourNow(); return h >= n.hours[0] && h < n.hours[1]; };
const npcAsleep = n => { const h = hourNow(); return n.staff ? (h >= 23 || h < 6) : (h >= 22 || h < (n.wander ? 7 : 6)); };
function npcAnchor(n){
  if (n.staff){ const st = STATIONS.find(s => s.id === n.staff); return st.id === 'east' ? [st.px-1, st.pz+2] : [st.px+2, st.pz+1]; }
  if (n.guide) return n.spot;
  if (n.post) return n.post;
  if (n.work && npcAtWork(n)) return [BY[n.work].door[0], BY[n.work].door[1]+1];
  const b = NHOME[n.home]; return b ? [b.door[0], b.door[1]+1] : [0,0];
}
function spawnNpcs(){

    g.traverse(o => { o.userData.npc = n.id; });

    const [ax, az] = npcAnchor(n), [i,j] = nearestFree(ax, az);
    npcs[n.id] = { n, g, model, lbl, i, j, x:wx(i), z:wz(j), path:[], face:0, walkT:0, wait:Math.random()*3, talking:false, sleep:false, hidden:false };
    g.position.set(wx(i), 0, wz(j));
  });
  if (G.me.kini && G.me.kini.on) kiniArrive();
  rebuildPickables();
}
const WANDER = {
  dan:[[0,0],[-6,9],[8,10],[-12,-6],[11,-10],[-39,2],[-40,-6],[34,8],[40,1],[6,34],[2,40],[-4,12]],
  kini:[[-40,-2],[-36,-4],[-44,4],[-20,2],[0,3],[-6,6],[7,2],[20,9],[36,6],[42,2],[6,33],[10,36],[2,37],[-38,6]],
};
function npcGoal(np){
  const n = np.n; let cx, cz, rad;
  if (n.staff || n.post){ [cx,cz] = npcAnchor(n); rad = 1; }
  else if (n.guide){ [cx,cz] = n.spot; rad = 2; }
  else if (WANDER[n.id]){ const pts = WANDER[n.id]; const p = pts[Math.floor(Date.now()/(n.id==='kini'?45000:40000) + (n.id==='kini'?3:0)) % pts.length]; cx = p[0]; cz = p[1]; rad = 3; }
  else { const b = NHOME[n.home]; cx = b.door[0]; cz = b.door[1]+1; rad = 3; }
  for (let k=0;k<20;k++){ const x = cx + Math.round((Math.random()*2-1)*rad), z = cz + Math.round((Math.random()*2-1)*rad); const [i,j] = T(x,z); if (inb(i,j) && !blocked(i,j)) return [i,j]; }

}
function npcWalk(np, dt, speed){
  const [ti,tj] = np.path[0], tx = wx(ti), tz = wz(tj), dx = tx-np.x, dz = tz-np.z, dist = Math.hypot(dx,dz), step = speed*dt;
  np.face = Math.atan2(dx,dz);
  if (dist <= step){ np.x = tx; np.z = tz; np.i = ti; np.j = tj; np.path.shift(); return false; }
  np.x += dx/dist*step; np.z += dz/dist*step; return true;
}
function npcTick(dt, tsec){

    const n = np.n, wasHidden = np.hidden;
    np.sleep = npcAsleep(n);

    if (following && np.sleep){ G.me.kini.on = false; saveMe(); toast('끼니가 졸려서 집으로 돌아갔어요. 내일 또 놀아요!', 2600); }
    np.hidden = np.sleep || npcAtWork(n) || isPatient(n.id) || !!n.notYet;
    if (wasHidden && !np.hidden){ const [ax,az] = npcAnchor(n), [i,j] = nearestFree(ax,az); np.i = i; np.j = j; np.x = wx(i); np.z = wz(j); np.path = []; }
    let moving = false;

      else if (following && me && !G.inside && !G.ride){
        const d = Math.hypot(me.x-np.x, me.z-np.z);
        if (d > 14){ const [i,j] = nearestFree(me.x - Math.sin(me.face)*1.2, me.z - Math.cos(me.face)*1.2); np.i = i; np.j = j; np.x = wx(i); np.z = wz(j); np.path = []; }
        else if (d > 1.7){ np.repath = (np.repath||0) - dt; if (np.repath <= 0 || !np.path.length){ np.repath = 0.6; const p = bfs(np.i, np.j, (i,j) => Math.abs(i-me.i)+Math.abs(j-me.j) <= 1 && !(i===me.i && j===me.j)); np.path = p ? p.slice(0, 40) : []; } }
        else np.path = [];
        if (np.path.length) moving = npcWalk(np, dt, d > 4 ? 4.2 : 3.3);
        else np.face = Math.atan2(me.x-np.x, me.z-np.z);

      }
    }
    if (np.talking && me) np.face = Math.atan2(me.x-np.x, me.z-np.z);
    let dr = np.face - np.g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); np.g.rotation.y += dr*Math.min(1, dt*10);
    np.walkT = moving ? np.walkT + dt*(n.bunny ? 13 : 11) : 0;
    const U = np.model.userData, sw = moving ? Math.sin(np.walkT)*0.6 : 0;
    U.legs[0].rotation.x = sw; U.legs[1].rotation.x = -sw; U.arms[0].rotation.x = -sw*0.8; U.arms[1].rotation.x = np.talking ? -0.5 + Math.sin(tsec*6)*0.25 : sw*0.8;

  });
}
function npcNear(){
  const me = chars[G.slot]; if (!me || G.inside) return null;
  const fx = me.x + Math.sin(me.face)*0.9, fz = me.z + Math.cos(me.face)*0.9;

}

function guideDest(t){
  if (t.at === 'myhome'){ const b = BUILD.find(x => x.kind==='house' && x.slot===G.slot); return [b.door[0], b.door[1]+1]; }
  if (t.at === 'kini'){ const k = npcs.kini; return k && !k.hidden ? [Math.round(k.x)+1, Math.round(k.z)] : null; }
  return t.at;
}
function startGuide(np, id){
  const t = GUIDE.find(g => g.id === id); if (!t) return;
  const dest = guideDest(t);
  if (!dest){ sayMore(t.lines.slice()); return; }
  const [di,dj] = nearestFree(dest[0], dest[1]);
  if (Math.abs(np.i-di)+Math.abs(np.j-dj) <= 2){ sayMore(t.lines.slice()); return; }
  const p = bfs(np.i, np.j, (i,j) => i===di && j===dj);
  if (!p){ sayMore(t.lines.slice()); return; }
  G.guide = { np, t, path:p, wait:0, far:0 };
  np.path = []; sayMore(['좋아, '+t.t+'에 대해 알려 줄게! 나를 따라와!']); dlg.closing = true;
}
function guideStep(np, dt){
  const Gd = G.guide, me = chars[G.slot]; if (!me) return false;
  const d = Math.hypot(me.x-np.x, me.z-np.z);
  if (G.inside || G.ride){ return false; }
  if (d > 40){ Gd.far += dt; if (Gd.far > 50){ G.guide = null; toast('토니: 앗, 길을 잃었나 봐. 다음에 다시 물어봐!', 2600); } return false; }
  Gd.far = 0;
  if (Gd.path.length){
    if (d > 6){ np.face = Math.atan2(me.x-np.x, me.z-np.z); Gd.wait += dt; if (Gd.wait > 1.5){ Gd.wait = -6; toast('토니가 기다리고 있어요. 따라가요!', 1600); } return false; }
    np.path = Gd.path; const mv = npcWalk(np, dt, 2.9); Gd.path = np.path; np.path = []; return mv;
  }
  np.face = Math.atan2(me.x-np.x, me.z-np.z);
  if (d < 3 && !dlg && !G.panel){ const t = Gd.t; G.guide = null; talkTo(np, t.lines.slice()); }
  return false;
}

/* dialogue options per villager */
function npcOptions(np){
  const n = np.n, id = n.id, rel = relOf(id), opts = [];
  if (n.guide) opts.push(['guide','알려 줘!']);
  if (np.clerk && G.inside && G.inside.shop){ opts.push(['svc', SHOP_SVC[G.inside.shop]]); if (G.inside.shop === 'cafe') opts.push(['menu','음료 주문']); }
  if (n.staff) opts.push(['ticket','기차표 사기']);
  if (id === 'kini'){ if (G.me.kini && G.me.kini.on) opts.push(['unfollow','그만 따라와']); else if (kiniTalks() >= 2) opts.push(['follow','같이 가자!']); }
  opts.push(['chat','이야기하기'], ['gift','선물하기']);
  if (!n.staff && id !== 'kini') opts.push(['quest', rel.quest && rel.quest.day===today() && !rel.quest.done ? '부탁한 것 주기' : '부탁 있어?']);
  if (n.extraOpts) n.extraOpts(np).forEach(o => opts.push(o));
  if (n.home && NH_REQ[n.home] && !np.sleep){ const H = villagerHome(n.home); opts.push(['home', H.done ? '집 구경 얘기' : (G.me.nhm||{})[n.home] ? '집 다 꾸몄어!' : '집 꾸며 줄까?']); }
  if (id === 'kini' && G.me.kini && G.me.kini.on) opts.push(['with','같이 가자']); else opts.push(['bye','잘 가']);
  return opts;
}
function kiniTalks(){ const k = G.me.kiniTalk || {}; return k.date === today() ? k.n : 0; }
function chooseV5(o){
  const np = dlg.np, id = np.n.id;
  if (o === 'guide'){
    const ch = talkEl().querySelector('.choices'); talkEl().querySelector('.text').textContent = '무엇이 궁금해? 고르면 직접 데려가서 알려 줄게!';
    ch.innerHTML = GUIDE.map(t => '<button data-gt="'+t.id+'">'+t.t+'</button>').join('') + '<button data-gt="">괜찮아</button>';
    ch.querySelectorAll('[data-gt]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const k = b.dataset.gt; if (!k){ showLine(); return; } startGuide(np, k); }));
    return true;
  }
  if (o === 'svc'){ const kind = G.inside.shop; endDialog(); shopService(kind); return true; }
  if (o === 'menu'){ endDialog(); openCafeMenu(); return true; }
  if (o === 'ticket'){ const st = STATIONS.find(s => s.id === np.n.staff); endDialog(); openStation(st); return true; }
  if (o === 'home'){ sayMore(homeChoice(np)); return true; }
  if (o === 'follow'){ G.me.kini = { on:true }; saveMe(); sayMore(['정말?! 헤헤, 같이 가자! 내가 옆에 있으면 행운이 따를 거야!']); return true; }
  if (o === 'with'){ sayMore([pickL(['응! 같이 가자!','헤헤, 어디로 갈까?','꼭 붙어 다닐게!'])]); dlg.closing = true; return true; }
  if (o === 'unfollow'){ G.me.kini = { on:false }; saveMe(); sayMore(['응… 알았어. 다음에 또 같이 다니자!']); return true; }
  if (typeof chooseV6 === 'function' && chooseV6(o)) return true;
  return false;
}

featTick = function(dt, tsec){
  _featTick0(dt, tsec);
  noteFx(dt); pvTick(dt);
  const ins = G.inside;
  if (ins && ins.clerkNp){ const c = ins.clerkNp, me = chars[G.slot], U = c.model.userData;
    if (!c.sleep && me){ const want = Math.atan2(me.x-c.x, me.z-c.z); let dr = want - c.g.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); c.g.rotation.y += dr*Math.min(1, dt*6); }
    else if (c.sleep){ c.g.rotation.y = 0; c.model.rotation.x = -Math.PI/2; c.model.position.y = c.bed ? 0.52 : 0.14; }
    if (!c.sleep){ U.arms[1].rotation.x = c.talking ? -0.5 + Math.sin(tsec*6)*0.25 : Math.sin(tsec*1.2)*0.05; c.model.position.y = Math.sin(tsec*2)*0.01; if (U.ears) U.ears.forEach((e,k) => e.rotation.x = Math.sin(tsec*3+k)*0.08); }
    if (c.lbl){ if (G.focus){ c.lbl.hidden = true; } else { _v.set(c.x, c.sleep ? 0.9 : 1.75, c.z).project(cam); c.lbl.hidden = false; c.lbl.style.left = ((_v.x+1)/2*window.innerWidth)+'px'; c.lbl.style.top = ((1-_v.y)/2*window.innerHeight)+'px'; } }
  }
  if (G.panel === 'map'){ G.mapT = (G.mapT||0) + dt; if (G.mapT > 0.5){ G.mapT = 0; drawMap(); } }
};

function npcPortrait(n){
  const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128; const g = cv.getContext('2d');
  const ell = (x,y,rx,ry,c,rot) => { g.fillStyle = c; g.beginPath(); g.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2); g.fill(); };
  const eyes = (y, big) => { [50,78].forEach(x => { ell(x,y,big?6:4.5,big?7.5:6,'#3a2e4a'); ell(x-1.8,y-2.6,big?2.2:1.6,big?2.4:1.8,'#fff'); }); };
  if (n.bunny){ const B = n.bunny;
    [[-1,46],[1,82]].forEach(([s,x]) => { ell(x,30,11,30,B.fur,0.18*s); ell(x,32,5.5,22,B.inner,0.18*s); });
    ell(64,82,42,36,B.fur); ell(64,96,24,14,B.belly||B.fur); eyes(80,true);
    g.globalAlpha = .55; ell(38,94,8,4.5,'#ff9eb0'); ell(90,94,8,4.5,'#ff9eb0'); g.globalAlpha = 1;
    g.fillStyle = '#ff8fa6'; g.beginPath(); g.moveTo(60,90); g.quadraticCurveTo(64,87,68,90); g.quadraticCurveTo(64,95,60,90); g.fill();
    if (B.bow){ ell(88,20,9,6,B.bow,0.5); ell(100,26,9,6,B.bow,-0.5); ell(94,23,4,4,B.bow); }
    if (B.scarf){ g.fillStyle = B.scarf; g.fillRect(30,114,68,10); }
    return cv; }
  const L = n.look, A = L.animal || {}, fur = A.fur || L.hairColor;
  if (A.type==='rabbit'){ ell(46,22,10,28,fur,-0.15); ell(82,22,10,28,fur,0.15); ell(46,24,5,20,A.inner,-0.15); ell(82,24,5,20,A.inner,0.15); }
  else if (A.type==='cat' || A.type==='fox'){ [-1,1].forEach(s => { g.fillStyle = fur; g.beginPath(); g.moveTo(64+s*22,46); g.lineTo(64+s*40,(A.type==='fox'?8:18)); g.lineTo(64+s*44,52); g.fill(); }); }
  else if (A.type==='bear'){ [-1,1].forEach(s => { ell(64+s*32,40,13,13,fur); ell(64+s*32,40,7,7,A.inner); }); }
  else if (A.type==='panda'){ [-1,1].forEach(s => ell(64+s*32,40,13,13,'#5a5060')); }
  else if (A.type==='sheep'){ [-1,1].forEach(s => ell(64+s*42,70,14,7,A.inner||'#f6d6c8',0.2*s)); }
  ell(64,70,40,38,L.hairColor); ell(64,76,34,30,L.skin); g.fillStyle = L.hairColor; g.beginPath(); g.ellipse(64,54,38,18,0,Math.PI,0); g.fill();
  if (A.type==='sheep') for (let k=0;k<7;k++) ell(34+k*10,40+Math.sin(k)*4,9,9,fur);
  if (A.type==='dog'){ [-1,1].forEach(s => ell(64+s*38,64,11,24,shade(fur,0.92),-0.25*s)); }
  if (A.type==='panda'){ ell(50,77,9,11,'#5a5060',-0.4); ell(78,77,9,11,'#5a5060',0.4); }
  eyes(76, false);
  ell(64,86,3,2.2,A.type==='fox'||A.type==='dog'||A.type==='bear'||A.type==='panda'?'#5a3a3a':'#ff9eb0'); g.globalAlpha = .5; ell(42,88,7,4,'#ff9eb0'); ell(86,88,7,4,'#ff9eb0'); g.globalAlpha = 1;
  if (n.staff){ g.fillStyle = '#3c6fd1'; g.beginPath(); g.ellipse(64,40,34,12,0,Math.PI,0); g.fill(); g.fillRect(64,38,40,5); }
  return cv;
}

/* ---------- composing (once per track, deterministic) ---------- */
function bgmRng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const RHY4 = [[2,2,2,2],[3,1,2,2],[2,1,1,2,2],[4,2,2],[2,2,4],[1,1,2,1,1,2],[3,1,4],[2,2,3,1],[6,2],[8]];
const RHY3 = [[2,2,2],[4,2],[2,4],[3,1,2],[1,1,2,2],[6]];
function compose(T){
  if (T.c) return T.c;
  const R = bgmRng(T.seed), sc = SCALES[T.scale], spb = 2, bar = T.meter * spb, rhy = T.meter === 3 ? RHY3 : RHY4;
  const deg = (d, oct) => { const i = d - 1, o = Math.floor(i / 7); return T.key + sc[((i % 7) + 7) % 7] + 12*(o + (oct || 0)); };
  const chordOf = d => [deg(d), deg(d + 2), deg(d + 4)].concat(T.sev ? [deg(d + 6)] : []);
  const pick = a => a[Math.floor(R()*a.length)];
  // melody for one 4-bar phrase over a progression
  const phrase = (prog, motif) => {
    const out = []; let cur = deg(1, 1) + 0;
    prog.forEach((d, b) => {
      const ch = chordOf(d).map(n => n + 12), r = (motif && b < 2) ? motif[b] : pick(rhy), notes = []; let pos = 0;
      r.forEach((len, k) => {
        let n;
        if (k === 0 || len >= 4){ n = ch.reduce((best, c) => Math.abs(c - cur) < Math.abs(best - cur) ? c : best, ch[0]); if (R() < 0.3) n = pick(ch); }
        else { const steps = sc.map(s => s + T.key + 12).concat(sc.map(s => s + T.key + 24)); const idx = steps.indexOf(steps.reduce((bst, s) => Math.abs(s - cur) < Math.abs(bst - cur) ? s : bst, steps[0])); n = steps[Math.max(0, Math.min(steps.length - 1, idx + pick([-2,-1,-1,1,1,2])))]; }
        if (R() < 0.08 && k > 0) n = null; // breath
        notes.push({ pos, len, n }); if (n) cur = n; pos += len;
      });
      if (b === prog.length - 1){ const last = notes[notes.length - 1]; last.n = ch[0]; } // land on the chord root
      out.push({ r, notes });
    });
    return out;
  };
  const A = phrase(T.prog), A2 = phrase(T.prog, [A[0].r, A[1].r]), B = phrase(T.progB), A3 = phrase(T.prog, [A[0].r, A[1].r]);
  A2[0] = A[0]; A2[1] = A[1]; A3[0] = A[0]; A3[1] = A[1];
  const bars = [], progAll = T.prog.concat(T.prog, T.progB, T.prog), mel = A.concat(A2, B, A3);
  progAll.forEach((d, b) => bars.push({ chord:chordOf(d), root:deg(d, -1), mel:mel[b].notes }));
  return T.c = { bars, bar, spb, steps:bars.length * bar };
}

let bgmOut = null;
function leadNote(ac, t, f, dur, kind, g){
  const o = bgmOut;
  switch (kind){
    case 'marimba': tone(ac, o, t, f, 0, 'triangle', 0.004, 0.45, 0.32*g); tone(ac, o, t, f*4, 0, 'sine', 0.002, 0.08, 0.05*g); break;
    case 'musicbox': tone(ac, o, t, f*2, 0, 'sine', 0.002, 0.9, 0.25*g); tone(ac, o, t, f*6, 0, 'sine', 0.001, 0.2, 0.04*g); break;
    case 'bell': tone(ac, o, t, f*2, 0, 'sine', 0.002, 1.2, 0.2*g); tone(ac, o, t, f*2*2.76, 0, 'sine', 0.002, 0.35, 0.05*g); break;
    case 'flute': tone(ac, o, t, f*2, dur*0.9, 'sine', 0.06, 0.12, 0.2*g, { vib:5, sus:true }); break;
    case 'whistle': tone(ac, o, t, f*2, dur*0.85, 'sine', 0.025, 0.08, 0.17*g, { vib:6, sus:true }); break;
    case 'square': tone(ac, o, t, f, dur*0.7, 'square', 0.01, 0.06, 0.07*g, { lp:1700, sus:true }); break;
    case 'pluck': tone(ac, o, t, f, 0, 'triangle', 0.003, 0.32, 0.3*g, { lp:2600 }); tone(ac, o, t, f*2, 0, 'sine', 0.003, 0.12, 0.06*g); break;
    case 'epiano': tone(ac, o, t, f, 0, 'sine', 0.006, 1.0, 0.26*g); tone(ac, o, t, f*2, 0, 'triangle', 0.004, 0.3, 0.05*g); break;
    case 'spooky': tone(ac, o, t, f, dur*0.85, 'triangle', 0.03, 0.15, 0.2*g, { vib:7, sus:true, lp:2000 }); break;
  }
}
function padChord(ac, t, ch, dur, g){ ch.forEach(n => tone(ac, bgmOut, t, MIDI(n), dur*0.95, 'triangle', 0.25, 0.4, 0.035*g, { lp:1100, sus:true })); }
function stab(ac, t, ch, g, len){ ch.forEach(n => tone(ac, bgmOut, t, MIDI(n), len || 0, 'triangle', 0.005, 0.18, 0.05*g, { lp:1800 })); }
function bassNote(ac, t, n, dur, g){ tone(ac, bgmOut, t, MIDI(n), dur*0.8, 'triangle', 0.01, 0.12, 0.2*g, { lp:600, sus:true }); }
const DRUMS = {
  soft:  { 4:['k...h...k.k.h...'] }, pop:{ 4:['k.h.s.h.k.hks.h.'] }, brush:{ 4:['k..hs..hk..hs.hh'] }, island:{ 4:['k..sh.k.k..sh.s.'] },
  sleigh:{ 4:['hhhhhhhhhhhhhhhh'] }, bossa:{ 4:['k..h.sh.k.h..sh.'] }, tick:{ 4:['h...h...h...h...'] }, train:{ 4:['khshkhshkhshkhsh'] }, none:{},
};
function drum(ac, t, ch, g){ if (ch === 'k') hit(ac, bgmOut, t, 'kick', 0.35*g); else if (ch === 's') hit(ac, bgmOut, t, 'snare', 0.12*g); else if (ch === 'h') hit(ac, bgmOut, t, 'hat', 0.06*g); }

function playStep(ac, T, step, t){
  const C = compose(T), sd = 60 / T.bpm / C.spb, bi = Math.floor(step / C.bar), s = step % C.bar, B = C.bars[bi];
  const swing = (T.drum === 'bossa' || T.lead === 'epiano') && s % 2 ? sd*0.12 : 0, tt = t + swing;
  B.mel.forEach(m => { if (m.pos === s && m.n) leadNote(ac, tt, MIDI(m.n), m.len*sd, T.lead, 1); });
  const beat = s / C.spb, onBeat = s % C.spb === 0;
  switch (T.pad){
    case 'pad': if (s === 0) padChord(ac, t, B.chord, C.bar*sd, 1); break;
    case 'arp': { const ch = B.chord.concat([B.chord[0] + 12]); tone(ac, bgmOut, t, MIDI(ch[s % ch.length]), 0, 'sine', 0.004, 0.3, 0.06, {}); break; }
    case 'comp': if (s % 4 === 2) stab(ac, tt, B.chord, 1); break;
    case 'reggae': if (s % 4 === 2) stab(ac, t, B.chord.map(n => n + 12), 1.1); break;
    case 'waltz': if (onBeat && beat > 0) stab(ac, t, B.chord, 0.9); break;
    case 'bossa': if ([0,3,6,10,13].includes(s % 16)) stab(ac, t, B.chord, 0.8); break;
  }
  switch (T.bass){
    case 'whole': if (s === 0) bassNote(ac, t, B.root, C.bar*sd, 1); break;
    case 'half': if (s % (C.bar/2) === 0) bassNote(ac, t, s ? B.root + 7 : B.root, C.bar/2*sd, 1); break;
    case 'bounce': if (onBeat) bassNote(ac, t, beat % 2 ? B.root + 7 : B.root, sd*1.6, 1); break;
    case 'walk': if (onBeat) bassNote(ac, tt, B.root + [0, 4, 7, 9][beat % 4], sd*1.8, 1); break;
    case 'waltz': if (s === 0) bassNote(ac, t, B.root, sd*2, 1); break;
    case 'bossa': if (s === 0 || s === 3 || s === 4) bassNote(ac, t, s === 0 ? B.root : B.root + 7, sd*1.4, 1); break;
  }
  const D = DRUMS[T.drum] && DRUMS[T.drum][4]; if (D){ const pat = D[0]; drum(ac, t, pat[(step % 16)], 1); }
}
